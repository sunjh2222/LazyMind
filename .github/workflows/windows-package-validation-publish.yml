name: Publish isolated Windows validation update

on:
  push:
    branches: [ci/windows-update-validation]
    paths:
      - .github/workflows/windows-package-validation-publish.yml
      - desktop/scripts/publish-windows-package-validation.py

concurrency:
  group: windows-policy-validation-publication-v1
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  VALIDATION_REPO: sunjh2222/LazyMind
  VALIDATION_BRANCH: ci/windows-update-validation
  A_RUN: '46113424979'
  A_SHA: 75ab8d6ff69a9284388ed0efc4690735b3fcb0d5
  B_RUN: '46126980513'
  B_SHA: a4cc8954a295da0fa7aefa80cb282d8bd3be39fc
  FORMAT_RUN: '46128541793'
  FORMAT_SHA: 6ddc43fe676a19caafdd3b432280cbe189494707
  FORMAT_JOB: '140928435140'
  FORMAT_ARTIFACT: '15257161830'
  FORMAT_DIGEST: sha256:8631d593a411afdbd79b7c5946506b4fdb283a97dd86c1080d6855742eb1513c

jobs:
  publish:
    if: github.repository == 'sunjh2222/LazyMind' && github.ref == 'refs/heads/ci/windows-update-validation'
    name: Sign and publish only the Windows validation round
    runs-on: ubuntu-latest
    environment: desktop_updates_test
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the original build and successful native format artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          check_run() {
            local actual expected
            actual="$(gh api "repos/${VALIDATION_REPO}/actions/runs/$1/attempts/1" --jq '[.head_repository.full_name, .head_branch, .head_sha, .run_attempt, .conclusion, .path] | @tsv')"
            expected="$(printf '%s\t%s\t%s\t1\t%s\t.github/workflows/%s' "$VALIDATION_REPO" "$VALIDATION_BRANCH" "$2" "$3" "$4")"
            if [[ "$actual" != "$expected" && "$actual" != "$expected@refs/heads/$VALIDATION_BRANCH" ]]; then
              echo 'Unexpected validation run identity or conclusion' >&2
              exit 1
            fi
          }
          check_run "$A_RUN" "$A_SHA" success windows-package-validation.yml
          check_run "$B_RUN" "$B_SHA" success windows-package-validation.yml
          check_run "$FORMAT_RUN" "$FORMAT_SHA" failure windows-package-validation-publish.yml
          job="$(gh api "repos/${VALIDATION_REPO}/actions/jobs/$FORMAT_JOB" --jq '[.run_id, .conclusion, .name] | @tsv')"
          [[ "$job" == "$(printf '%s\tsuccess\tVerify the original data format on Windows' "$FORMAT_RUN")" ]]
          artifact="$(gh api "repos/${VALIDATION_REPO}/actions/artifacts/$FORMAT_ARTIFACT" --jq '[.id, .name, .expired, .digest, .workflow_run.id, .workflow_run.head_sha, .workflow_run.head_branch] | @tsv')"
          [[ "$artifact" == "$(printf '%s\twindows-validation-format\tfalse\t%s\t%s\t%s\t%s' "$FORMAT_ARTIFACT" "$FORMAT_DIGEST" "$FORMAT_RUN" "$FORMAT_SHA" "$VALIDATION_BRANCH")" ]]

      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.VALIDATION_REPO }}
          run-id: ${{ env.A_RUN }}
          name: windows-x64-package-validation-0.5.401-${{ env.A_RUN }}-1
          path: validation/a
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.VALIDATION_REPO }}
          run-id: ${{ env.A_RUN }}
          name: windows-x64-validation-components-0.5.401-${{ env.A_RUN }}-1
          path: validation/a-components
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.VALIDATION_REPO }}
          run-id: ${{ env.B_RUN }}
          name: windows-x64-package-validation-0.5.402-${{ env.B_RUN }}-1
          path: validation/b
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.VALIDATION_REPO }}
          run-id: ${{ env.B_RUN }}
          name: windows-x64-validation-components-0.5.402-${{ env.B_RUN }}-1
          path: validation/b-components
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ env.VALIDATION_REPO }}
          run-id: ${{ env.FORMAT_RUN }}
          artifact-ids: ${{ env.FORMAT_ARTIFACT }}
          merge-multiple: true
          path: validation
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: local/local-runtime-manager/go.sum
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.31'
          enable-cache: false
      - name: Build independent policy validator
        working-directory: local/local-runtime-manager
        run: go build -o "$RUNNER_TEMP/update-publisher" ./cmd/update-publisher
      - name: Bind both build records and native evidence to the isolated publication
        run: |
          set -euo pipefail
          uv run --no-project --python 3.11 python desktop/scripts/publish-windows-package-validation.py prepare \
            --artifacts validation --evidence validation/format-evidence.json \
            --validator "$RUNNER_TEMP/update-publisher" --output "$RUNNER_TEMP/validation-plan"
      - name: Sign the exact A to B policy with the isolated test signing key
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.WINDOWS_TEST_UPDATE_POLICY_PRIVATE_KEY }}
          UPDATE_KEY_ID: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_POLICY_KEY_ID }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/validation-plan"
          if [[ -f "$plan/published-policy.json" ]]; then
            cp "$plan/published-policy.json" "$plan/policy.json"
            cp "$plan/config.json" "$plan/policy-config.json"
          else
            : "${UPDATE_PRIVATE_KEY:?Missing isolated policy signing key}"
            : "${UPDATE_KEY_ID:?Missing isolated policy signing key ID}"
            umask 077
            key_file="$(mktemp "$RUNNER_TEMP/windows-test-key.XXXXXX")"
            trap 'rm -f "$key_file"' EXIT
            printf '%s' "$UPDATE_PRIVATE_KEY" > "$key_file"
            "$RUNNER_TEMP/update-publisher" sign \
              --records validation --plan "$plan/plan.json" --key-id "$UPDATE_KEY_ID" --key-file "$key_file" \
              --output "$plan/policy.json" --config-output "$plan/policy-config.json"
          fi
          "$RUNNER_TEMP/update-publisher" verify --envelope "$plan/policy.json" --config "$plan/policy-config.json" >/dev/null
      - name: Publish and read back each Windows component ZIP and tag catalog
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.11 --with modelscope-hub==0.4.6 python desktop/scripts/publish-windows-package-validation.py publish-components \
            --artifacts validation --output "$RUNNER_TEMP/validation-plan"
      - name: Publish and read back immutable releases before switching the policy
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          uv run --no-project --python 3.11 --with modelscope-hub==0.4.6 python desktop/scripts/publish-windows-package-validation.py publish-releases \
            --artifacts validation --validator "$RUNNER_TEMP/update-publisher" --output "$RUNNER_TEMP/validation-plan"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-validation-policy-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-plan/policy.json
          if-no-files-found: error
